<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我本是－哲美系二手書店｜書籍庫存查詢</title>
    <link rel="icon" type="image/jpeg" href="./assets/logo.jpg" />
    <link rel="apple-touch-icon" href="./assets/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Noto+Serif+TC:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260612-2" />

    <!-- Google tag (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G9T6ZLVH8P"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-G9T6ZLVH8P");
    </script>

    <script defer src="./config.js"></script>
    <script defer src="./app.js?v=20260612-1"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="search-panel" aria-labelledby="page-title">
        <div class="brand-header">
          <img class="brand-logo" src="./assets/logo.jpg" alt="我本是－哲美系二手書店標誌" />
          <div class="brand-copy">
            <p class="eyebrow">Jhemeisi Secondhand Books</p>
            <h1 id="page-title">
              <span>我本是－哲美系二手書店</span>
              <strong>書籍庫存查詢</strong>
            </h1>
          </div>
        </div>

        <form class="search-box" id="searchForm">
          <label for="searchInput">輸入書名、條碼或作者</label>
          <div class="search-row">
            <input
              id="searchInput"
              name="query"
              type="search"
              autocomplete="off"
              placeholder="例如：大武山下、龍應台、9789571382647"
            />
            <button type="submit">查詢</button>
          </div>
        </form>

        <div class="status-bar">
          <span id="resultSummary">載入最近書籍中...</span>
          <span id="updatedAt"></span>
        </div>
      </section>

      <section class="results-panel" aria-live="polite">
        <div class="list-intro">
          <h2 id="listTitle">最近來到哲美系的書</h2>
          <p id="listDescription">這裡會顯示近期整理建檔的書籍。若想找特定書名、作者或關鍵字，也可以直接搜尋。</p>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>書名</th>
                <th>條碼</th>
                <th>作者</th>
                <th>庫存</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
          <div class="empty-state" id="emptyState">
            <strong>載入最近書籍中</strong>
            <span>近期整理建檔的書籍會顯示在這裡。</span>
          </div>
        </div>
      </section>

      <footer class="site-footer">
        <div class="footer-motto">閱讀、流動與再相遇</div>
        <h2>與我們聯繫</h2>
        <p class="footer-copy">
          <span>找到想看的書了嗎？</span>
          <span>若想確認書況、購買，或詢問收書，歡迎透過社群與我們聯繫。</span>
          <span>也可以追蹤我們，看看最近來到哲美系的書與日常。</span>
        </p>
        <nav class="social-links" aria-label="社群連結">
          <a href="https://www.facebook.com/jhemeisi" target="_blank" rel="noopener noreferrer">Facebook</a>
          <a href="https://www.instagram.com/iam_jhemeisi/" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="https://www.threads.net/@iam_jhemeisi" target="_blank" rel="noopener noreferrer">Threads</a>
          <a href="https://medium.com/@jhemeisi" target="_blank" rel="noopener noreferrer">Medium</a>
        </nav>
        <small>哲美系二手書店｜雲林斗六</small>
      </footer>
    </main>
  </body>
</html>
